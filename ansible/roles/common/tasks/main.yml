- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time }}"
    upgrade: "{{ 'dist' if common_apt_upgrade else 'no' }}"

- name: Ensure timesyncd is installed
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present

- name: Enable and start timesyncd service
  ansible.builtin.systemd_service:
    name: "{{ common_ntp_services }}"
    state: started
    enabled: true

- name: Deploy SSH hardening configuration
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Apply group specific UFW rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.src | default('any') }}"
  loop: "{{ common_ufw_custom_rules }}"

- name: Set default incoming policy to deny and enable UFW
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
