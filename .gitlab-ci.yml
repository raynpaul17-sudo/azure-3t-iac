include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - validate # fmt, validate, lint
  - test # secret detection
  - security # checkov
  - plan

terraform-fmt:
  stage: validate
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  script: terraform fmt -check -recursive terraform/

terraform-validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init -backend=false
    - terraform validate

ansible-lint:
  stage: validate
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir ansible-lint
    - cd ansible
    - ansible-galaxy collection install -r requirements.yaml
  script:
    - ansible-lint

tflint:
  stage: validate
  image:
    name: ghcr.io/terraform-linters/tflint
    entrypoint: [""]
  script:
    - cd terraform
    - tflint --recursive

checkov:
  stage: security
  image:
    name: bridgecrew/checkov:3.3.19
    entrypoint: [""]
  script:
    - checkov -d terraform --framework terraform

terraform:plan:
  stage: plan
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "api://AzureADTokenExchange"
  variables:
    ARM_USE_OIDC: "true"
    TF_ROOT: "terraform"
  before_script:
    - export ARM_OIDC_TOKEN="${GITLAB_OIDC_TOKEN}"
    - cd "${TF_ROOT}"
    - |
      STATE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/default"
      terraform init \
        -backend-config="address=${STATE_URL}" \
        -backend-config="lock_address=${STATE_URL}/lock" \
        -backend-config="unlock_address=${STATE_URL}/lock" \
        -backend-config="username=gitlab-ci-token" \
        -backend-config="password=${CI_JOB_TOKEN}" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=DELETE" \
        -backend-config="retry_wait_min=5"
  script:
    - terraform plan -refresh=false -var-file="terraform.tfvars.example" -var "ssh_public_key_path=${CI_PROJECT_DIR}/terraform/fixtures/ci_key.pub"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "main"
